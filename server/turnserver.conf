# coturn configuration — TURN relay for NEON CITY STRIKE
# Two phones on mobile data hide their real IP behind carrier NAT. STUN cannot
# get through that; only a relay can. This file is that relay.

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech

# CHANGE THIS to something long and random, and use the same value for
# &turnUser= / &turnPass= in the game link.
user=ncs:CHANGE_ME_RANDOM_PASSWORD

# cosmetic only, but some clients check it
realm=CHANGE_ME_TO_YOUR_DOMAIN

# Put your server's PUBLIC ip here. If the VPS sits behind a NAT (home server,
# some providers) put the PUBLIC ip of the router instead.
external-ip=CHANGE_ME_TO_YOUR_PUBLIC_IP

# A plain VPS needs none of these. Uncomment the block below only if you also
# want TURN over TLS (port 5349) — it needs a real certificate.
#
# use-auth-secret / static-auth-secret
# cert=/etc/letsencrypt/live/CHANGE_ME_DOMAIN/fullchain.pem
# pkey=/etc/letsencrypt/live/CHANGE_ME_DOMAIN/privkey.pem

# keep the relay honest
no-multicast-peers
no-cli
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# room for 4 players plus headroom
max-bps=10000000
total-quota=100

# verbose logging while you are debugging
log-file=stdout
simple-log
