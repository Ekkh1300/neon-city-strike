# ---------------------------------------------------------------- HTTP :80
# Only two jobs: the ACME challenge that gets us a certificate, and a redirect.
server {
    listen 80;
    server_name GAME_DOMAIN_PLACEHOLDER;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------- HTTPS :443
server {
    listen 443 ssl;
    http2 on;
    server_name GAME_DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/GAME_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/GAME_DOMAIN_PLACEHOLDER/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # the game is one file and changes often — never cache it
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # ---------------------------------------------------- PeerJS signalling
    # WebSocket: Upgrade/Connection are mandatory or the handshake never completes.
    location /peerjs {
        proxy_pass http://peerjs:9000/peerjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # a room can sit idle in the lobby for minutes
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ------------------------------------------------------------- the game
    location / {
        try_files $uri $uri/ =404;
    }
}
